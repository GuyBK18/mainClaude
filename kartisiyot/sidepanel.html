<!doctype html>
<html lang="he" dir="rtl" data-theme="drawer" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>כרטיסיות</title>
  <script src="look.js"></script>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/theme-drawer.css">
  <link rel="stylesheet" href="styles/theme-console.css">
  <link rel="stylesheet" href="styles/theme-glass.css">
  <link rel="stylesheet" href="styles/panel.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="app" id="app">
    <header class="top">
      <div class="bar">
        <div class="brand"><h1>כרטיסיות</h1><span class="summary" id="summary"></span></div>
        <div class="tools">
          <button class="ibtn" type="button" data-act="add" id="btnAdd" title="שמירת הלשונית הנוכחית" aria-label="שמירת הלשונית הנוכחית"></button>
          <button class="ibtn" type="button" data-act="mode" id="btnMode"></button>
          <button class="ibtn" type="button" data-act="settings" id="btnSettings" title="הגדרות" aria-label="הגדרות"></button>
        </div>
      </div>
      <div id="listHead">
        <label class="search"><span id="searchIcon"></span><input id="search" type="search" placeholder="חיפוש בקבוצות, בכותרות ובמשימות" autocomplete="off" aria-label="חיפוש"><kbd>/</kbd></label>
        <nav class="filters" id="filters" aria-label="סינון"></nav>
        <div class="here" id="here" hidden></div>
      </div>
    </header>
    <div class="cols" id="cols"><span>קבוצה</span><span>פריטים</span><span>פעילות</span></div>
    <main class="list" id="list"></main>
    <section id="side" hidden></section>
    <footer class="keys" id="keys"></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script src="sidepanel.js"></script>
</body>
</html>
