<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כרטיסיות · כיוון א: מפתח</title>
<link rel="stylesheet" href="shared/fonts.css">
<style>
/* Direction A, "Index": a book index. Type does all the work: no boxes, no chips, one red accent (rubrication). */
:root {
  --paper: #f7f4ed; --paper-2: #eee8dc; --paper-3: #fbf9f4;
  --ink: #1e1c18; --ink-2: #48433b; --mute: #6b655a;
  --rubric: #a3321f; --on-rubric: #fff;
  --leader: #b9b09f; --rule: #d9d1c1;
  --live: #1f6b3a;
  --serif: "Frank Ruhl Libre", "Times New Roman", serif;
  --sans: "Assistant", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #171613; --paper-2: #22201b; --paper-3: #1c1a17;
    --ink: #ede7da; --ink-2: #cac2b2; --mute: #a0988a;
    --rubric: #e8917b; --on-rubric: #1a1714;
    --leader: #4d483f; --rule: #37332c;
    --live: #8fd0a4;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 13.5px/1.45 var(--sans); width: 360px; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
.ic { display: block; flex: none; }
.fav { display: block; flex: none; border-radius: 2px; }
bdi { unicode-bidi: isolate; }

/* ---------- masthead ---------- */
.mast { padding: 14px 16px 0; }
.mast-row { display: flex; align-items: center; gap: 2px; }
.mast h1 { font: 700 23px/1 var(--serif); margin: 0; flex: 1; letter-spacing: 0; }
.ibtn { width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-2); border-radius: 2px; cursor: pointer; }
.ibtn:hover { background: var(--paper-2); color: var(--ink); }
.search { display: flex; align-items: center; gap: 8px; margin-top: 12px; border-bottom: 1.5px solid var(--ink); padding-bottom: 5px; color: var(--mute); }
.search input { flex: 1; border: 0; background: none; outline: none; font: 400 15px/1.2 var(--serif); color: var(--ink); padding: 0; }
.search input::placeholder { color: var(--mute); }
.filters { margin: 9px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 3px 13px; font-size: 13px; }
.filters li { color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.filters li .n { font-size: 11px; color: var(--mute); margin-inline-start: 3px; font-feature-settings: "tnum"; }
.filters li.on { color: var(--rubric); font-weight: 700; text-decoration: underline 1.5px; text-underline-offset: 5px; }
.filters li.on .n { color: var(--rubric); }
.filters li.zero { color: var(--mute); opacity: .75; }
.here { display: flex; align-items: center; gap: 7px; margin-top: 12px; font-size: 12.5px; color: var(--ink-2); }
.here b { font: 600 13.5px/1 var(--serif); color: var(--ink); }

/* ---------- sections ---------- */
.sect { display: flex; align-items: baseline; gap: 7px; padding: 17px 16px 3px; font: 700 12px/1 var(--sans); color: var(--rubric); }
.sect .n { font-weight: 400; color: var(--mute); font-feature-settings: "tnum"; }

/* ---------- entries ---------- */
.entry { padding: 6px 16px 7px; cursor: pointer; }
.entry:hover { background: var(--paper-3); }
.e-head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.ribbon { align-self: flex-start; margin-top: 2px; width: 9px; height: 13px; flex: none; }
.ribbon svg { width: 9px; height: 13px; }
.e-name { font: 600 16px/1.3 var(--serif); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; text-align: right; }
.e-name.unnamed { font-weight: 500; color: var(--ink-2); }
.e-hosts { font: 400 12px/1 var(--sans); color: var(--mute); margin-inline-start: 4px; }
.e-status { font-size: 12px; color: var(--mute); white-space: nowrap; flex: none; }
.e-pin { color: var(--mute); align-self: center; }
.leader { flex: 1 1 14px; min-width: 14px; height: 4px; background: radial-gradient(circle, var(--leader) 0.9px, transparent 1.1px) 0 0 / 5px 4px repeat-x; }
.e-count { font: 500 13px/1 var(--sans); color: var(--ink-2); font-feature-settings: "tnum"; flex: none; }
.e-items { margin: 1px 0 0; padding-inline-start: 15px; font: 400 13.5px/1.45 var(--serif); color: var(--ink-2); display: flex; align-items: baseline; white-space: nowrap; overflow: hidden; }
.rt { flex: 0 1 auto; min-width: 3.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.rt:first-of-type { max-width: 62%; min-width: 0; }
.rest { flex: none; margin-inline-start: 8px; opacity: .8; }
.e-items .sep { flex: none; align-self: center; display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--rubric); vertical-align: middle; margin: 0 6px; opacity: .8; }
.e-line { margin: 2px 0 0; padding-inline-start: 15px; font-size: 12.5px; color: var(--ink); display: flex; gap: 5px; align-items: baseline; }
.e-line .k { color: var(--rubric); font-weight: 700; flex: none; }
.e-line.stale { color: var(--rubric); }
.e-line bdi { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- the open entry ---------- */
.entry.open { background: var(--paper-2); padding-bottom: 12px; cursor: default; }
.entry.open .e-name { font-size: 17px; }
.e-meta { display: flex; align-items: center; gap: 10px; padding-inline-start: 15px; margin-top: 3px; font-size: 12.5px; color: var(--mute); }
.sel { display: inline-flex; align-items: center; gap: 3px; color: var(--ink); font-weight: 600; border-bottom: 1px dotted var(--ink-2); cursor: pointer; }
.e-meta .live { color: var(--live); }
.list { list-style: none; margin: 7px 0 0; padding: 0; }
.it { position: relative; display: grid; grid-template-columns: 15px 16px 1fr auto; column-gap: 7px; align-items: center; padding: 3px 0; }
.it .n { font: 500 11px/1 var(--sans); color: var(--rubric); font-feature-settings: "tnum"; text-align: center; }
.it .t { font: 400 14px/1.35 var(--serif); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.it .h { font: 400 11.5px/1 var(--sans); color: var(--mute); direction: ltr; max-width: 92px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it.active .t { font-weight: 600; }
.it.active::before { content: ""; position: absolute; inset-inline-start: -16px; top: 4px; bottom: 4px; width: 3px; background: var(--rubric); }
.it .note { grid-column: 3 / 5; display: flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.it .note .ic { color: var(--rubric); }
.it.notopen .t { color: var(--mute); }
.it.notopen .fav { filter: grayscale(1); opacity: .45; }
.it.notopen .h { direction: rtl; font-size: 11.5px; }
.it.hover { background: var(--paper-3); margin-inline: -8px; padding-inline: 8px; }
.acts { display: flex; gap: 0; }
.acts button { width: 24px; height: 22px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-2); cursor: pointer; border-radius: 2px; }
.acts button:hover { color: var(--ink); background: var(--paper-2); }
.task { margin-top: 10px; padding-inline-start: 22px; }
.task label { display: block; font: 700 12px/1 var(--sans); color: var(--rubric); margin-bottom: 4px; }
.task textarea { width: 100%; height: 26px; resize: none; border: 0; border-bottom: 1px solid var(--leader); background: none; font: 400 14px/1.4 var(--serif); padding: 2px 0; outline: none; }
.task textarea::placeholder { color: var(--mute); }
.claude { display: flex; gap: 8px; margin-top: 12px; padding-inline-start: 22px; }
.btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; border: 1.5px solid var(--ink); background: none; font: 600 13px/1 var(--sans); cursor: pointer; border-radius: 0; }
.btn.ink { background: var(--ink); color: var(--paper); }
.more { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; padding-inline-start: 22px; font-size: 12.5px; }
.more a { color: var(--ink-2); text-decoration: underline 1px var(--leader); text-underline-offset: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.foot { height: 24px; }
</style>
</head>
<body>
<header class="mast">
  <div class="mast-row">
    <h1>כרטיסיות</h1>
    <button class="ibtn" title="הוספת הלשונית הנוכחית" id="b-add"></button>
    <button class="ibtn" title="סל המחזור" id="b-trash"></button>
    <button class="ibtn" title="הגדרות" id="b-set"></button>
  </div>
  <label class="search"><span id="s-ic"></span><input type="search" placeholder="חיפוש בקבוצות, בכותרות ובמשימות"></label>
  <ul class="filters" id="filters"></ul>
  <div class="here" id="here"></div>
</header>
<main id="list"></main>
<div class="foot"></div>
<script src="shared/mock.js"></script>
<script>
document.getElementById('b-add').innerHTML = icon('plus', 19);
document.getElementById('b-trash').innerHTML = icon('trash', 17);
document.getElementById('b-set').innerHTML = icon('sliders', 18);
document.getElementById('s-ic').innerHTML = icon('search', 16);

var dark = matchMedia('(prefers-color-scheme: dark)').matches;
function gc(g) { return GROUP_COLORS[g.color][dark ? 1 : 0]; }
function ribbon(g) { return '<span class="ribbon" style="color:' + gc(g) + '">' + icon('ribbon', 13) + '</span>'; }

document.getElementById('filters').innerHTML = FILTERS.map(function (f, i) {
  return '<li class="' + (i === 0 ? 'on' : '') + (f.n ? '' : ' zero') + '">' + f.label + '<span class="n">' + f.n + '</span></li>';
}).join('');
var g1 = SAMPLE.groups[0];
document.getElementById('here').innerHTML = ribbon(g1) + '<span>הלשונית הפעילה כבר בקבוצה</span><b>' + bdi(g1.name) + '</b>';

function name(g) {
  if (g.name) return '<h3 class="e-name" dir="auto">' + esc(g.name) + '</h3>';
  return '<h3 class="e-name unnamed">ללא שם<span class="e-hosts"><bdi dir="ltr">' + esc(topHosts(g).join(', ')) + '</bdi></span></h3>';
}
function head(g) {
  return '<div class="e-head">' + ribbon(g) + name(g) +
    (g.pinned ? '<span class="e-pin" title="נעוצה">' + icon('pin', 12) + '</span>' : '') +
    (g.status !== 'none' && !g.open ? '<span class="e-status">' + STATUS[g.status] + '</span>' : '') +
    '<span class="leader"></span><span class="e-count">' + g.items.length + '</span></div>';
}
function collapsed(g) {
  var titles = runon(g);
  var h = '<article class="entry">' + head(g) + '<p class="e-items">' + titles + '</p>';
  if (g.task) h += '<p class="e-line"><span class="k">משימה</span>' + bdi(g.task) + '</p>';
  if (isStale(g)) h += '<p class="e-line stale">' + icon('clock', 12) + staleText(g.days) + '</p>';
  return h + '</article>';
}
function item(it, i) {
  var cls = 'it' + (it.active ? ' active' : '') + (it.notOpen ? ' notopen' : '') + (it.hover ? ' hover' : '');
  var end = it.hover
    ? '<span class="acts"><button title="שינוי כותרת">' + icon('pencil', 14) + '</button><button title="הערה">' + icon('note', 14) + '</button><button title="העברה לקבוצה אחרת">' + icon('move', 14) + '</button><button title="סיימתי">' + icon('check', 15) + '</button></span>'
    : '<span class="h">' + (it.notOpen ? 'לא פתוח' : esc(hostOf(it.url))) + '</span>';
  var note = it.note ? '<div class="note">' + icon('note', 13) + '<span>' + esc(it.note) + '</span></div>' : '';
  return '<li class="' + cls + '"><span class="n">' + (i + 1) + '</span>' + fav(it.url, 15) + line(displayTitle(it)) + end + note + '</li>';
}
function expanded(g) {
  g.open = true;
  return '<article class="entry open">' + head(g) +
    '<div class="e-meta"><span class="sel">' + STATUS[g.status] + icon('chevronDown', 12) + '</span><span class="live">פתוחה בכרום</span><span>פריט אחד לא פתוח</span></div>' +
    '<ol class="list">' + g.items.map(item).join('') + '</ol>' +
    '<div class="task"><label>משימה לקבוצה</label><textarea rows="1" placeholder="מה לעשות עם הקבוצה. יישלח לקלוד עם הקישורים"></textarea></div>' +
    '<div class="claude"><button class="btn ink">' + icon('chat', 15) + 'צ׳אט עם קלוד</button><button class="btn">' + icon('terminal', 15) + 'קלוד קוד</button></div>' +
    '<div class="more"><a>' + icon('window', 13) + 'הצגה בכרום</a><a>' + icon('closeSave', 13) + 'סגירה ושמירה</a><a>' + icon('copy', 13) + 'העתקה</a><a>' + icon('more', 13) + 'עוד</a></div>' +
    '</article>';
}

var live = SAMPLE.groups.filter(function (g) { return g.live; });
var saved = SAMPLE.groups.filter(function (g) { return !g.live; });
document.getElementById('list').innerHTML =
  '<div class="sect">פתוחות בכרום<span class="n">' + live.length + '</span></div>' +
  live.map(function (g, i) { return i === 0 ? expanded(g) : collapsed(g); }).join('') +
  '<div class="sect">שמורות<span class="n">' + saved.length + '</span></div>' +
  saved.map(collapsed).join('');
</script>
</body>
</html>
